name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: myredis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Build release JAR
        run: mvn --batch-mode package -DskipTests

      - name: Validate release artifact
        run: test -s target/myredis-0.1.0-SNAPSHOT.jar

      - name: Build Docker image
        run: docker build --tag myredis:ci .

      - name: Validate Docker image
        run: test "$(docker image inspect myredis:ci --format '{{.Id}}')" != ""

      - name: Validate Docker runtime hardening
        run: |
          test "$(docker image inspect myredis:ci --format '{{.Config.User}}')" = "myredis"
          test "$(docker image inspect myredis:ci --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect myredis:ci --format '{{json .Config.Entrypoint}}' | grep -F 'MaxRAMPercentage=75.0'

      - name: Smoke test Docker container
        run: |
          docker volume create myredis-ci-data >/dev/null
          docker run --detach --name myredis-ci --publish 6380:6379 --volume myredis-ci-data:/app/data myredis:ci
          cleanup() {
            docker rm --force myredis-ci >/dev/null 2>&1 || true
            docker volume rm myredis-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' myredis-ci)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            docker logs myredis-ci
            exit 1
          fi
          python - <<'PY'
          import socket

          def command(value):
              with socket.create_connection(("127.0.0.1", 6380), timeout=5) as client:
                  client.sendall((value + "\r\n").encode())
                  return client.recv(1024).decode()

          assert command("SET ci-key persisted") == "OK\r\n"
          PY
          docker restart myredis-ci
          for attempt in {1..20}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' myredis-ci)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            docker logs myredis-ci
            exit 1
          fi
          python - <<'PY'
          import socket

          with socket.create_connection(("127.0.0.1", 6380), timeout=5) as client:
              client.sendall(b"GET ci-key\r\n")
              assert client.recv(1024).decode() == "persisted\r\n"
          PY

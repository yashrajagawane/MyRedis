name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test

      - name: Build release JAR
        run: mvn --batch-mode package -DskipTests

      - name: Validate release artifact
        run: test -s target/myredis-0.1.0-SNAPSHOT.jar

      - name: Build Docker image
        run: docker build --tag myredis:ci .

      - name: Validate Docker image
        run: test "$(docker image inspect myredis:ci --format '{{.Id}}')" != ""

      - name: Smoke test Docker container
        run: |
          docker run --detach --name myredis-ci --publish 6380:6379 myredis:ci
          cleanup() { docker rm --force myredis-ci; }
          trap cleanup EXIT
          for attempt in {1..20}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' myredis-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs myredis-ci
          exit 1

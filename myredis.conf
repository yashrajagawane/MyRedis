# MyRedis runtime configuration. CLI arguments override environment and this file.
host=127.0.0.1
port=6379
aof.enabled=true
aof.path=data/myredis.aof
aof.fsync=ALWAYS
snapshot.path=data/myredis.snapshot
snapshot.interval.seconds=60
log.level=INFO
limits.max.value.bytes=16777216
limits.max.array.elements=1024
limits.max.connections=10000
# Optional password authentication. Leave blank to disable authentication.
auth.password=
limits.client.idle.timeout.seconds=0
limits.max.commands.per.second=0
